<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cờ Caro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --board-bg: #1e293b;
            --cell-bg: #334155;
            --cell-border: #0f172a;
            --text-color: #f8fafc;
            --x-color: #ef4444; /* Đỏ/Hồng cho X */
            --o-color: #0ea5e9; /* Xanh dương cho O */
            --last-move-bg: #475569;
            --win-bg: #fbbf24;
            --primary-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            touch-action: manipulation; /* Ngăn zoom khi double tap trên mobile */
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: -webkit-linear-gradient(45deg, var(--primary-color), var(--o-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--board-bg);
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
        }

        .select-group select, .btn-reset {
            background: var(--cell-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .select-group select:hover, .btn-reset:hover {
            background: var(--last-move-bg);
        }

        .btn-reset {
            background: var(--primary-color);
            color: white;
        }
        .btn-reset:hover {
            background: #059669;
        }

        .status-bar {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .turn-indicator {
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--board-bg);
            transition: 0.3s;
        }

        .turn-x { color: var(--x-color); border: 1px solid var(--x-color); }
        .turn-o { color: var(--o-color); border: 1px solid var(--o-color); }

        /* Board Styling */
        .board-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1; /* Giữ bảng luôn hình vuông */
            background-color: var(--cell-border);
            border: 4px solid var(--board-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .board {
            display: grid;
            width: 100%;
            height: 100%;
            /* Mặc định 15x15. Sẽ set bằng JS */
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 1px; /* Tạo đường kẻ */
            background-color: var(--cell-border);
        }

        .cell {
            background-color: var(--board-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(100vw / 22); /* Chữ tự co giãn theo màn hình */
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        @media (min-width: 600px) {
            .cell {
                font-size: 28px; /* Cố định font trên màn PC */
            }
        }

        .cell:hover {
            background-color: var(--cell-bg);
        }

        .cell.x {
            color: var(--x-color);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }

        .cell.o {
            color: var(--o-color);
            text-shadow: 0 0 8px rgba(14, 165, 233, 0.5);
        }

        /* Hiệu ứng ô vừa đánh */
        .cell.last-move {
            background-color: var(--last-move-bg);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
            animation: pulse 1.5s infinite;
        }

        /* Hiệu ứng dải ô chiến thắng */
        .cell.win-cell {
            background-color: var(--win-bg) !important;
            color: #000 !important;
            text-shadow: none !important;
            transform: scale(1.05);
            z-index: 10;
        }

        @keyframes pulse {
            0% { box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.2); }
        }

        /* Modal Kết Quả */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--board-bg);
            padding: 30px 40px;
            border-radius: 15px;
            text-align: center;
            transform: translateY(-50px);
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cờ Caro </h1>
        <div class="controls">
            <div class="select-group">
                <select id="gameMode">
                    <option value="pve">Người vs Máy (AI)</option>
                    <option value="pvp">Người vs Người</option>
                </select>
            </div>
            <button class="btn-reset" onclick="initGame()">Chơi Lại</button>
        </div>
        <div class="status-bar">
            <span>Lượt đánh: </span>
            <span id="turnIndicator" class="turn-indicator turn-x">Người chơi X</span>
        </div>
    </header>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <!-- Modal thông báo người thắng -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2 class="modal-title" id="modalMessage">X Chiến Thắng!</h2>
            <button class="modal-btn" onclick="closeModalAndReset()">Chơi Ván Mới</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 15; // Bàn cờ 15x15 chuẩn caro
        const boardElement = document.getElementById('board');
        const turnIndicator = document.getElementById('turnIndicator');
        const modeSelect = document.getElementById('gameMode');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalMessage = document.getElementById('modalMessage');

        let board = [];
        let currentPlayer = 'X'; // X đi trước
        let gameActive = true;
        let lastMoveElement = null;
        let isAiThinking = false;

        // Điểm trọng số cho AI (Tấn công và Phòng thủ)
        const attackScores = [0, 9, 54, 162, 1458, 13112, 118008];
        const defenseScores = [0, 3, 27, 99, 729, 6561, 59049];

        // Khởi tạo ván game
        function initGame() {
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardElement.style.gridTemplateRows = `repeat(${BOARD_SIZE}, 1fr)`;
            
            board = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                let row = [];
                for (let j = 0; j < BOARD_SIZE; j++) {
                    row.push('');
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('click', handleCellClick);
                    boardElement.appendChild(cell);
                }
                board.push(row);
            }

            currentPlayer = 'X';
            gameActive = true;
            lastMoveElement = null;
            isAiThinking = false;
            updateTurnIndicator();
        }

        // Xử lý khi click vào ô
        function handleCellClick(e) {
            if (!gameActive || isAiThinking) return;

            const row = parseInt(e.target.dataset.row);
            const col = parseInt(e.target.dataset.col);

            if (board[row][col] !== '') return; // Ô đã có người đánh

            makeMove(row, col, currentPlayer);

            if (!gameActive) return; // Nếu đánh xong mà kết thúc game thì ngưng

            // Chế độ đánh với Máy
            if (modeSelect.value === 'pve' && currentPlayer === 'O') {
                isAiThinking = true;
                updateTurnIndicator("AI đang nghĩ...");
                setTimeout(makeAiMove, 300); // Tạo độ trễ giả cho AI để UX tốt hơn
            }
        }

        // Thực hiện nước đi
        function makeMove(row, col, player) {
            board[row][col] = player;
            const cell = getCellElement(row, col);
            cell.textContent = player;
            cell.classList.add(player.toLowerCase());

            // Xử lý hiệu ứng "Ô vừa đánh" (Hủy ô cũ, sáng ô mới)
            if (lastMoveElement) {
                lastMoveElement.classList.remove('last-move');
            }
            cell.classList.add('last-move');
            lastMoveElement = cell;

            // Kiểm tra thắng thua
            const winCells = checkWin(row, col, player);
            if (winCells) {
                highlightWinCells(winCells);
                showModal(`${player === 'X' ? 'Người chơi X' : (modeSelect.value === 'pve' ? 'Máy (O)' : 'Người chơi O')} Chiến Thắng!`);
                gameActive = false;
                return;
            }

            // Kiểm tra hòa
            if (checkDraw()) {
                showModal("Ván Cờ Hòa!");
                gameActive = false;
                return;
            }

            // Đổi lượt
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnIndicator();
        }

        // Lấy element từ tọa độ
        function getCellElement(row, col) {
            return boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        // Cập nhật text hiển thị lượt
        function updateTurnIndicator(customText = null) {
            turnIndicator.className = `turn-indicator turn-${currentPlayer.toLowerCase()}`;
            if (customText) {
                turnIndicator.textContent = customText;
            } else {
                let name = currentPlayer === 'X' ? 'Người chơi X' : 'Người chơi O';
                if (modeSelect.value === 'pve' && currentPlayer === 'O') name = 'Máy (O)';
                turnIndicator.textContent = `Lượt của: ${name}`;
            }
        }

        // --- Logic AI (Máy đánh) ---
        function makeAiMove() {
            let bestScore = -Infinity;
            let bestMove = { row: -1, col: -1 };
            
            // Lặp qua toàn bộ bàn cờ để chấm điểm
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] === '') {
                        let score = evaluateCell(r, c);
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = { row: r, col: c };
                        }
                    }
                }
            }

            // Đánh vào ô có điểm cao nhất
            // Nếu bàn cờ trống hoàn toàn, đánh vào giữa
            if (bestMove.row === -1) {
                bestMove = { row: Math.floor(BOARD_SIZE/2), col: Math.floor(BOARD_SIZE/2) };
            }

            makeMove(bestMove.row, bestMove.col, 'O');
            isAiThinking = false;
        }

        // Hàm chấm điểm 1 ô trống cho AI
        function evaluateCell(row, col) {
            let totalScore = 0;
            const directions = [
                [0, 1], [1, 0], [1, 1], [1, -1] // Ngang, dọc, chéo chính, chéo phụ
            ];

            directions.forEach(dir => {
                let attack = evaluateDirection(row, col, dir[0], dir[1], 'O'); // Điểm tấn công
                let defense = evaluateDirection(row, col, dir[0], dir[1], 'X'); // Điểm chặn người chơi
                
                // AI Gomoku: Phòng thủ thường quan trọng bằng hoặc hơn tấn công để sống sót
                totalScore += attackScores[attack.count] + defenseScores[defense.count];

                // Thưởng điểm nếu cờ mở 2 đầu
                if (attack.openEnds === 2) totalScore += attackScores[attack.count] * 0.5;
                if (defense.openEnds === 2) totalScore += defenseScores[defense.count] * 0.5;
            });

            return totalScore;
        }

        // Đếm số cờ liên tiếp và độ mở của 1 hướng
        function evaluateDirection(row, col, dRow, dCol, player) {
            let count = 0;
            let openEnds = 0;

            // Kiểm tra chiều tiến
            let r = row + dRow, c = col + dCol;
            while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
                count++;
                r += dRow;
                c += dCol;
            }
            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === '') openEnds++;

            // Kiểm tra chiều lùi
            r = row - dRow; c = col - dCol;
            while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
                count++;
                r -= dRow;
                c -= dCol;
            }
            if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === '') openEnds++;

            return { count: Math.min(count, 5), openEnds };
        }

        // --- Logic Kiểm tra Thắng ---
        function checkWin(row, col, player) {
            const directions = [
                [[0, 1], [0, -1]], // Ngang
                [[1, 0], [-1, 0]], // Dọc
                [[1, 1], [-1, -1]],// Chéo \
                [[1, -1], [-1, 1]] // Chéo /
            ];

            for (let dir of directions) {
                let count = 1;
                let winCells = [{row, col}];

                for (let d of dir) {
                    let r = row + d[0];
                    let c = col + d[1];
                    while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === player) {
                        count++;
                        winCells.push({row: r, col: c});
                        r += d[0];
                        c += d[1];
                    }
                }

                if (count >= 5) {
                    return winCells; // Trả về mảng các ô thắng
                }
            }
            return null;
        }

        // Tô màu các ô chiến thắng
        function highlightWinCells(cells) {
            cells.forEach(pos => {
                const cell = getCellElement(pos.row, pos.col);
                cell.classList.add('win-cell');
            });
        }

        // Kiểm tra hòa (đầy bàn cờ)
        function checkDraw() {
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (board[i][j] === '') return false;
                }
            }
            return true;
        }

        // --- Xử lý Giao diện ---
        function showModal(message) {
            modalMessage.textContent = message;
            // Delay hiện modal một chút để người chơi thấy rõ đường cờ thắng
            setTimeout(() => {
                modalOverlay.classList.add('active');
            }, 500);
        }

        function closeModalAndReset() {
            modalOverlay.classList.remove('active');
            initGame();
        }

        // Lắng nghe thay đổi chế độ chơi để reset game
        modeSelect.addEventListener('change', initGame);

        // Khởi động game lần đầu
        initGame();

    </script>
</body>
</html>
